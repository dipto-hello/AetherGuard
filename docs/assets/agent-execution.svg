<g><rect x="244" y="96" width="172" height="64" rx="8" fill="#1f1a0e" stroke="#fbbf24"/><text x="258" y="123" fill="#e6edf3" font-size="16" font-weight="600">AI claim judge</text><text x="258" y="143" fill="#b4bfcc" font-size="13">Ticket + photo · policy</text></g>
<g><rect x="456" y="96" width="172" height="64" rx="8" fill="#151b27" stroke="#46556b"/><text x="470" y="123" fill="#e6edf3" font-size="16" font-weight="600">Agent proposal</text><text x="470" y="143" fill="#b4bfcc" font-size="13">Gemini · checked</text></g>
<g><rect x="668" y="96" width="172" height="64" rx="8" fill="#151b27" stroke="#46556b"/><text x="682" y="123" fill="#e6edf3" font-size="16" font-weight="600">MCP authorization</text><text x="682" y="143" fill="#b4bfcc" font-size="13">Caller · order scope</text></g>
<g><rect x="880" y="96" width="172" height="64" rx="8" fill="#102736" stroke="#38bdf8"/><text x="894" y="123" fill="#e6edf3" font-size="16" font-weight="600">Policy decision</text><text x="894" y="143" fill="#b4bfcc" font-size="13">Verdict in SQLite</text></g>
