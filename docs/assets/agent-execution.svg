<g><rect x="304" y="96" width="216" height="64" rx="8" fill="#151b27" stroke="#46556b"/><text x="320" y="123" fill="#e6edf3" font-size="17" font-weight="600">Agent proposal</text><text x="320" y="143" fill="#b4bfcc" font-size="13">Gemini · check proposal</text></g>
