<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1096" height="460" viewBox="0 0 1096 460" role="img" aria-labelledby="agent-execution-title agent-execution-desc" id="agent-execution-root">
<title id="agent-execution-title">Agent execution flow</title>
<desc id="agent-execution-desc">The operator creates scope. An AI claim judge reviews the ticket and optional photo against a refund policy. Unless the claim is invalid, the agent requests a model proposal. The MCP wrapper checks authorization before policy. Valid refunds within the auto-approve limit execute; larger refunds and judge-unsure refunds require human review; rule failures and judge-invalid claims are blocked.</desc>
<defs>
