<svg xmlns="http://www.w3.org/2000/svg" width="1096" height="460" viewBox="0 0 1096 460" role="img" aria-labelledby="agent-execution-title agent-execution-desc" id="agent-execution-root">
<title id="agent-execution-title">Agent execution flow</title>
<desc id="agent-execution-desc">The operator creates scope. The agent requests a model proposal. The MCP wrapper checks authorization before policy. Refunds within the auto-approve limit execute; larger ones require human review.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style><marker id="agent-execution-agent-execution-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#8b949e"/></marker></defs>
<rect x="0" y="0" width="1096" height="460" rx="16" fill="#0b0e14"/>
<text x="32" y="55" fill="#e6edf3" font-family="Instrument Serif, Georgia, serif" font-size="36">Agent execution flow</text>
