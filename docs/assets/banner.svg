<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">AetherGuard</title>
  <desc id="d">A customer claim with an optional photo is checked by an AI judge, turned into a refund proposal, and passed through a policy shield. It is executed when the judge rates it valid and it is within the limit, sent to human review when it is over the limit or the judge is unsure, or blocked when a rule fails or the judge rates it invalid.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="74%" cy="50%" r="45%">
      <stop offset="0" stop-color="#34d399" stop-opacity=".22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#090D16"/>
      <stop offset=".45" stop-color="#090D16" stop-opacity=".6"/>
      <stop offset="1" stop-color="#090D16" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122b38"/>
      <stop offset="1" stop-color="#101822"/>
    </linearGradient>
    <path id="pIn" d="M690 180H940"/>
    <path id="pTop" d="M1030 180H1050C1080 180 1080 100 1100 100"/>
    <path id="pMid" d="M1030 180H1100"/>
    <path id="pBot" d="M1030 180H1050C1080 180 1080 260 1100 260"/>
  </defs>

  <rect width="1280" height="360" rx="20" fill="#090D16"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>
  <rect width="1280" height="360" rx="20" fill="url(#fade)"/>
  <rect x=".5" y=".5" width="1279" height="359" rx="20" fill="none" stroke="#1E293B"/>

  <!-- copy -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">
    <text x="64" y="104" fill="#71c5ba" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="3">AI AGENT GOVERNANCE</text>
    <text x="62" y="178" fill="#F8FAFC" font-size="76" font-weight="800" letter-spacing="-2">Aether<tspan fill="#34d399">Guard</tspan></text>
    <text x="64" y="222" fill="#aebdca" font-size="20">AI judges the claim. Policy decides the money.</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#c4d9ff">
      <rect x="64" y="256" width="96" height="30" rx="15" fill="#101822" stroke="#334155"/>
      <text x="112" y="276" text-anchor="middle">AI judge</text>
      <rect x="170" y="256" width="78" height="30" rx="15" fill="#101822" stroke="#334155"/>
      <text x="209" y="276" text-anchor="middle">MCP</text>
      <rect x="258" y="256" width="96" height="30" rx="15" fill="#101822" stroke="#334155"/>
      <text x="306" y="276" text-anchor="middle">Policy</text>
      <rect x="364" y="256" width="146" height="30" rx="15" fill="#101822" stroke="#334155"/>
      <text x="437" y="276" text-anchor="middle">Human approval</text>
      <rect x="520" y="256" width="88" height="30" rx="15" fill="#101822" stroke="#334155"/>
      <text x="564" y="276" text-anchor="middle">Audit</text>
    </g>
  </g>

  <!-- flow lines (drawn under the cards so moving dots pass behind them) -->
  <g fill="none" stroke-width="2" stroke-dasharray="4 6">
    <use href="#pIn" stroke="#94a3b8" stroke-opacity=".45"/>
    <use href="#pTop" stroke="#34d399" stroke-opacity=".55"/>
    <use href="#pMid" stroke="#7dd3fc" stroke-opacity=".55"/>
    <use href="#pBot" stroke="#fb7185" stroke-opacity=".55"/>
  </g>

  <g fill="#F8FAFC">
    <circle r="4"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath href="#pIn"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3s" repeatCount="indefinite" begin="1.5s"><mpath href="#pIn"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath href="#pTop"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite" begin="1s"><mpath href="#pMid"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite" begin="2s"><mpath href="#pBot"/></animateMotion></circle>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <!-- customer claim -->
    <rect x="580" y="148" width="110" height="64" rx="12" fill="#101822" stroke="#334155"/>
    <text x="635" y="174" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">Claim</text>
    <text x="635" y="196" text-anchor="middle" fill="#aebdca" font-size="12">ticket + photo</text>

    <!-- AI judge -->
    <circle cx="756" cy="180" r="34" fill="#1f1a0e" stroke="#fbbf24" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="1;.45;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <g fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M756 164V196M746 196H766M740 170H772"/>
      <path d="M740 170L734 182M740 170L746 182M772 170L766 182M772 170L778 182"/>
      <path d="M733 182Q740 190 747 182M765 182Q772 190 779 182"/>
    </g>
    <text x="756" y="238" text-anchor="middle" fill="#fbbf24" font-size="12" letter-spacing="2">AI JUDGE</text>

    <!-- refund proposal -->
    <rect x="815" y="148" width="110" height="64" rx="12" fill="#101822" stroke="#334155"/>
    <text x="870" y="174" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">Proposal</text>
    <text x="870" y="196" text-anchor="middle" fill="#aebdca" font-size="12">refund · ৳4,200</text>

    <!-- policy shield -->
    <path d="M985 124L1030 142V182C1030 210 1010 228 985 240C960 228 940 210 940 182V142Z" fill="url(#shield)" stroke="#34d399" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="1;.45;1" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M966 182L980 196L1006 166" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="985" y="266" text-anchor="middle" fill="#71c5ba" font-size="12" letter-spacing="2">POLICY</text>

    <!-- outcomes -->
    <rect x="1100" y="82" width="130" height="36" rx="18" fill="#0f2a22" stroke="#34d399"/>
    <text x="1165" y="105" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700" letter-spacing="1.5">EXECUTE</text>
    <text x="1165" y="135" text-anchor="middle" fill="#8b9bb0" font-size="11">valid · within limit</text>
    <rect x="1100" y="162" width="130" height="36" rx="18" fill="#0f2233" stroke="#7dd3fc"/>
    <text x="1165" y="185" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="700" letter-spacing="1.5">REVIEW</text>
    <text x="1165" y="215" text-anchor="middle" fill="#8b9bb0" font-size="11">over limit · AI unsure</text>
    <rect x="1100" y="242" width="130" height="36" rx="18" fill="#2a1219" stroke="#fb7185"/>
    <text x="1165" y="265" text-anchor="middle" fill="#fb7185" font-size="13" font-weight="700" letter-spacing="1.5">BLOCK</text>
    <text x="1165" y="295" text-anchor="middle" fill="#8b9bb0" font-size="11">rule fails · AI invalid</text>
  </g>
</svg>
