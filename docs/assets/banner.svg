<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">AetherGuard</title>
  <desc id="d">An AI agent's refund proposal passes through a policy shield and is executed, sent to human review, or blocked.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="74%" cy="50%" r="45%">
      <stop offset="0" stop-color="#34d399" stop-opacity=".22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#090D16"/>
      <stop offset=".45" stop-color="#090D16" stop-opacity=".6"/>
      <stop offset="1" stop-color="#090D16" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122b38"/>
      <stop offset="1" stop-color="#101822"/>
    </linearGradient>
    <path id="pTop" d="M840 180H1000C1040 180 1040 100 1080 100"/>
    <path id="pMid" d="M840 180H1080"/>
    <path id="pBot" d="M840 180H1000C1040 180 1040 260 1080 260"/>
  </defs>

  <rect width="1280" height="360" rx="20" fill="#090D16"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>
  <rect width="1280" height="360" rx="20" fill="url(#fade)"/>
  <rect x=".5" y=".5" width="1279" height="359" rx="20" fill="none" stroke="#1E293B"/>

  <!-- copy -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">
    <text x="64" y="104" fill="#71c5ba" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="3">AI AGENT GOVERNANCE</text>
    <text x="62" y="178" fill="#F8FAFC" font-size="76" font-weight="800" letter-spacing="-2">Aether<tspan fill="#34d399">Guard</tspan></text>
    <text x="64" y="224" fill="#aebdca" font-size="22">Review AI-proposed refunds before they change a ledger.</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#c4d9ff">
      <rect x="64" y="256" width="78" height="30" rx="15" fill="#101822" stroke="#334155"/>
      <text x="103" y="276" text-anchor="middle">MCP</text>
      <rect x="152" y="256" width="96" height="30" rx="15" fill="#101822" stroke="#334155"/>
      <text x="200" y="276" text-anchor="middle">Policy</text>
      <rect x="258" y="256" width="146" height="30" rx="15" fill="#101822" stroke="#334155"/>
      <text x="331" y="276" text-anchor="middle">Human approval</text>
      <rect x="414" y="256" width="88" height="30" rx="15" fill="#101822" stroke="#334155"/>
      <text x="458" y="276" text-anchor="middle">Audit</text>
    </g>
  </g>

  <!-- flow -->
  <g fill="none" stroke-width="2" stroke-dasharray="4 6">
    <use href="#pTop" stroke="#34d399" stroke-opacity=".55"/>
    <use href="#pMid" stroke="#7dd3fc" stroke-opacity=".55"/>
    <use href="#pBot" stroke="#fb7185" stroke-opacity=".55"/>
  </g>

  <g fill="#F8FAFC">
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath href="#pTop"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite" begin="1s"><mpath href="#pMid"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite" begin="2s"><mpath href="#pBot"/></animateMotion></circle>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <!-- agent proposal -->
    <rect x="690" y="148" width="150" height="64" rx="12" fill="#101822" stroke="#334155"/>
    <text x="765" y="174" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">Agent proposal</text>
    <text x="765" y="196" text-anchor="middle" fill="#aebdca" font-size="12">refund · $42.00</text>

    <!-- policy shield -->
    <path d="M950 116L1004 138V184C1004 216 980 238 950 252C920 238 896 216 896 184V138Z" fill="url(#shield)" stroke="#34d399" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="1;.45;1" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M928 184L944 200L974 166" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="950" y="278" text-anchor="middle" fill="#71c5ba" font-size="12" letter-spacing="2">POLICY</text>

    <!-- outcomes -->
    <rect x="1080" y="82" width="140" height="36" rx="18" fill="#0f2a22" stroke="#34d399"/>
    <text x="1150" y="105" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700" letter-spacing="1.5">EXECUTE</text>
    <rect x="1080" y="162" width="140" height="36" rx="18" fill="#0f2233" stroke="#7dd3fc"/>
    <text x="1150" y="185" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="700" letter-spacing="1.5">REVIEW</text>
    <rect x="1080" y="242" width="140" height="36" rx="18" fill="#2a1219" stroke="#fb7185"/>
    <text x="1150" y="265" text-anchor="middle" fill="#fb7185" font-size="13" font-weight="700" letter-spacing="1.5">BLOCK</text>
  </g>
</svg>
