<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherGuard · System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>AetherGuard Zero-Trust Governance Architecture</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sysarch-title sysarch-desc">
        <title id="sysarch-title">AetherGuard Zero-Trust Governance Architecture</title>
        <desc id="sysarch-desc">Architecture diagram showing React client, FastAPI ingress, bilingual support agent, governed MCP boundary, deterministic policy engine, and SQLite execution sandbox.</desc>
        <defs>
          <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.8" fill="rgba(45,49,66,0.08)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

        <!-- Boundary Zones (Drawn first) -->
        <!-- Zone 1: Client & Ingress -->
        <rect x="40" y="80" width="220" height="420" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <rect x="80" y="86" width="140" height="16" rx="2" fill="#f5f5f5"/>
        <text x="150" y="98" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT &amp; INGRESS</text>

        <!-- Zone 2: Untrusted Agent Boundary -->
        <rect x="300" y="80" width="320" height="420" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <rect x="340" y="86" width="240" height="16" rx="2" fill="#f5f5f5"/>
        <text x="460" y="98" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROBABILISTIC AGENT BOUNDARY</text>

        <!-- Zone 3: Deterministic Governance & Sandbox -->
        <rect x="660" y="80" width="300" height="420" rx="8" fill="rgba(191,69,32,0.03)" stroke="rgba(191,69,32,0.20)" stroke-width="1"/>
        <rect x="710" y="86" width="200" height="16" rx="2" fill="#f5f5f5"/>
        <text x="810" y="98" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DETERMINISTIC FIREWALL</text>

        <!-- Connectors (Drawn before node boxes) -->
        <!-- 1. Frontend to Ingress -->
        <line x1="150" y1="210" x2="150" y2="290" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        
        <!-- 2. Ingress to Agent Core -->
        <line x1="220" y1="340" x2="340" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 3. Agent to LLM Chain -->
        <line x1="460" y1="290" x2="460" y2="210" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 4. LLM to Agent Proposal -->
        <line x1="500" y1="210" x2="500" y2="290" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 5. Agent to Governed MCP Boundary (Focal Path) -->
        <line x1="580" y1="340" x2="700" y2="340" stroke="#bf4520" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

        <!-- 6. Governance Boundary to Policy / Approval / Sandbox -->
        <line x1="810" y1="290" x2="810" y2="210" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="810" y1="390" x2="810" y2="430" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Connector Labels -->
        <rect x="110" y="242" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="150" y="254" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BEARER AUTH</text>

        <rect x="240" y="328" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="280" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRE-SCOPE</text>

        <rect x="600" y="328" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="640" y="340" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP PROPOSAL</text>

        <rect x="820" y="242" width="60" height="16" rx="2" fill="#f5f5f5"/>
        <text x="850" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POLICY</text>

        <rect x="820" y="402" width="60" height="16" rx="2" fill="#f5f5f5"/>
        <text x="850" y="414" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ATOMIC</text>

        <!-- Node Boxes -->
        <!-- Node 1: React Frontend -->
        <rect x="60" y="140" width="180" height="70" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="70" y="150" width="48" height="14" rx="2" fill="#f5f5f5"/>
        <text x="94" y="161" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">UI SPA</text>
        <text x="70" y="182" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">React 19 Dashboard</text>
        <text x="70" y="198" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Vite · In-Memory Token</text>

        <!-- Node 2: FastAPI Ingress -->
        <rect x="60" y="290" width="180" height="90" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="70" y="300" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="98" y="311" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GATEWAY</text>
        <text x="70" y="332" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">FastAPI Ingress</text>
        <text x="70" y="348" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">OperatorAuth (HMAC)</text>
        <text x="70" y="364" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">1MB Size &amp; 20 RPM Limit</text>

        <!-- Node 3: Model Inference Fallback Chain -->
        <rect x="320" y="130" width="280" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="330" y="140" width="52" height="14" rx="2" fill="#f5f5f5"/>
        <text x="356" y="151" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">MODELS</text>
        <text x="330" y="172" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Google Gemini &amp; Gemma Chain</text>
        <text x="330" y="188" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">3.5 Flash Lite ➔ 3.1 ➔ Gemma 4 ➔ Synth</text>
        <text x="330" y="202" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace">auto_execute=False · Untrusted Output</text>

        <!-- Node 4: Support Agent Core -->
        <rect x="320" y="290" width="280" height="90" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="330" y="300" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="358" y="311" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AGENT</text>
        <text x="330" y="332" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Bilingual Support Agent</text>
        <text x="330" y="348" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">EN / BN Numeral Normalizer</text>
        <text x="330" y="364" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Pre-Scope Data Minimization</text>

        <!-- Node 5: Policy Engine & Approval Desk -->
        <rect x="680" y="130" width="260" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="690" y="140" width="52" height="14" rx="2" fill="#f5f5f5"/>
        <text x="716" y="151" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POLICY</text>
        <text x="690" y="172" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Policy &amp; Human Approval</text>
        <text x="690" y="188" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Auto-Allow Ceiling: $50.00</text>
        <text x="690" y="202" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Quarantine Desk (SHA-256 Sig)</text>

        <!-- Node 6: Governed MCP Server (Focal Element) -->
        <rect x="680" y="290" width="260" height="100" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1.6"/>
        <rect x="690" y="300" width="70" height="14" rx="2" fill="#bf4520"/>
        <text x="725" y="311" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">CORE FIREWALL</text>
        <text x="690" y="334" fill="#111111" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Governed MCP Boundary</text>
        <text x="690" y="352" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">Official SDK (mcp==2.3.0)</text>
        <text x="690" y="366" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">Principal Caller Identity Check</text>
        <text x="690" y="380" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">TaskScope Budget &amp; Tool Ceiling</text>

        <!-- Node 7: SQLite Ledger & Sandbox -->
        <rect x="680" y="430" width="260" height="60" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="690" y="438" width="46" height="14" rx="2" fill="#f5f5f5"/>
        <text x="713" y="449" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STORE</text>
        <text x="690" y="468" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">SQLite Sandbox &amp; Ledger</text>
        <text x="690" y="482" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">WAL Mode · Atomic Rollback on Error</text>

        <!-- Legend Bar -->
        <rect x="40" y="515" width="920" height="30" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <circle cx="65" cy="530" r="4" fill="#2e5aa8"/>
        <text x="75" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">HTTP / Auth Ingress</text>

        <circle cx="215" cy="530" r="4" fill="#bf4520"/>
        <text x="225" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Governed Tool Execution</text>

        <circle cx="395" cy="530" r="4" fill="#4f5d75"/>
        <text x="405" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Internal Evaluation</text>

        <line x1="555" y1="530" x2="575" y2="530" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="585" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Untrusted Model Proposal</text>

        <text x="820" y="534" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Single-Operator Sandbox</text>
      </svg>
    </div>
  </div>
</body>
</html>
