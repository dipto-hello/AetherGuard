<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherGuard · Governed Refund Execution Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Diagram Design</p>
    <h1>Governed Refund Execution Flow &amp; Tri-Branch Decision Logic</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="execflow-title execflow-desc">
        <title id="execflow-title">Governed Refund Execution Flow</title>
        <desc id="execflow-desc">Flowchart showing support ticket intake, pre-scope agent extraction, governed MCP validation, policy tri-branch triage (Allowed, Quarantined, Blocked), and atomic SQLite ledger execution.</desc>
        <defs>
          <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.8" fill="rgba(45,49,66,0.08)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

        <!-- Connectors (Drawn first) -->
        <!-- 1. Customer Ticket to Pre-Scope Agent -->
        <line x1="160" y1="160" x2="220" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- 2. Agent to LLM Extraction and Back -->
        <path d="M 320,130 V 104 Q 320,96 328,96 H 420 Q 428,96 428,104 V 130" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 3. Agent to Governed MCP Boundary (Focal Path) -->
        <line x1="420" y1="160" x2="480" y2="160" stroke="#bf4520" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

        <!-- 4. MCP to Decision Triage: 3-Way Branch -->
        <!-- Branch A: Top to Allowed -->
        <path d="M 680,140 H 712 Q 720,140 720,132 V 100 Q 720,92 728,92 H 760" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        
        <!-- Branch B: Middle to Approval Required -->
        <line x1="680" y1="160" x2="760" y2="160" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Branch C: Bottom to Blocked -->
        <path d="M 680,180 H 712 Q 720,180 720,188 V 220 Q 720,228 728,228 H 760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 5. Approval Desk Human Resolution Path -->
        <line x1="860" y1="200" x2="860" y2="280" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- 6. Convergence to Atomic SQLite Execution -->
        <!-- From Allowed -->
        <path d="M 960,92 H 972 Q 980,92 980,100 V 370 Q 980,380 970,380 H 740" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        
        <!-- From Approved -->
        <path d="M 860,340 V 372 Q 860,380 852,380 H 740" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Connector Labels -->
        <rect x="170" y="148" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="190" y="158" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SUBMIT</text>

        <rect x="350" y="86" width="50" height="14" rx="2" fill="#f5f5f5"/>
        <text x="375" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PROMPT</text>

        <rect x="430" y="148" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="450" y="158" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PROPOSAL</text>

        <rect x="700" y="82" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="720" y="92" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;=$50</text>

        <rect x="696" y="148" width="48" height="14" rx="2" fill="#f5f5f5"/>
        <text x="720" y="158" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">$50-$1K</text>

        <rect x="696" y="218" width="48" height="14" rx="2" fill="#f5f5f5"/>
        <text x="720" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">REJECT</text>

        <!-- Node Boxes -->
        <!-- Node 1: Customer Ticket -->
        <rect x="40" y="120" width="120" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="48" y="128" width="36" height="14" rx="2" fill="#f5f5f5"/>
        <text x="66" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">INPUT</text>
        <text x="48" y="158" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">User Ticket</text>
        <text x="48" y="174" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace">Bilingual: EN / BN</text>
        <text x="48" y="186" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace">e.g. "Refund $40"</text>

        <!-- Node 2: Support Agent Core -->
        <rect x="220" y="120" width="200" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="228" y="128" width="46" height="14" rx="2" fill="#f5f5f5"/>
        <text x="251" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AGENT</text>
        <text x="228" y="158" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Support Agent Core</text>
        <text x="228" y="174" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace">Zero Pre-Scope DB Reads</text>
        <text x="228" y="186" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace">Gemini/Gemma (auto_exec=F)</text>

        <!-- Node 3: Governed MCP Server (Focal Element) -->
        <rect x="480" y="110" width="200" height="100" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1.6"/>
        <rect x="488" y="118" width="70" height="14" rx="2" fill="#bf4520"/>
        <text x="523" y="129" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">CORE FIREWALL</text>
        <text x="488" y="148" fill="#111111" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Governed MCP Boundary</text>
        <text x="488" y="164" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">1. Caller Identity Verified</text>
        <text x="488" y="178" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">2. TaskScope Budget &amp; State</text>
        <text x="488" y="192" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">3. Deterministic Policy Rules</text>

        <!-- Branch A: Allowed -->
        <rect x="760" y="60" width="200" height="64" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
        <rect x="768" y="68" width="50" height="14" rx="2" fill="#2e5aa8"/>
        <text x="793" y="79" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">AUTO-ALLOW</text>
        <text x="768" y="98" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">VERDICT: ALLOWED</text>
        <text x="768" y="112" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace">&lt;= $50.00 &amp; Order Balance OK</text>

        <!-- Branch B: Approval Required -->
        <rect x="760" y="136" width="200" height="64" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="768" y="144" width="64" height="14" rx="2" fill="#bf4520"/>
        <text x="800" y="155" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">QUARANTINE</text>
        <text x="768" y="174" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">APPROVAL REQUIRED</text>
        <text x="768" y="188" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace">$50.01 - $1,000.00 Ceiling</text>

        <!-- Branch C: Blocked -->
        <rect x="760" y="210" width="200" height="64" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="768" y="218" width="44" height="14" rx="2" fill="#f5f5f5"/>
        <text x="790" y="229" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">BLOCKED</text>
        <text x="768" y="248" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">VERDICT: BLOCKED</text>
        <text x="768" y="262" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace">Overdraw / Ceiling / Diversion</text>

        <!-- Node 4: Approval Desk Review -->
        <rect x="760" y="280" width="200" height="60" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="768" y="288" width="60" height="14" rx="2" fill="#f5f5f5"/>
        <text x="798" y="299" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">OPERATOR</text>
        <text x="768" y="318" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Human Approval Desk</text>
        <text x="768" y="332" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace">SHA-256 Sig · In-Flight Lock</text>

        <!-- Node 5: Atomic SQLite Execution & Audit -->
        <rect x="480" y="350" width="260" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="488" y="358" width="46" height="14" rx="2" fill="#f5f5f5"/>
        <text x="511" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ATOMIC</text>
        <text x="488" y="388" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">SQLite Execution &amp; Audit</text>
        <text x="488" y="404" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace">BEGIN IMMEDIATE · WAL Mode</text>
        <text x="488" y="418" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace">Deduct Balance + Commit Audit Event</text>

        <!-- Legend Bar -->
        <rect x="40" y="520" width="920" height="30" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <circle cx="65" cy="535" r="4" fill="#2e5aa8"/>
        <text x="75" y="539" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Auto-Approved Path</text>

        <circle cx="230" cy="535" r="4" fill="#bf4520"/>
        <text x="240" y="539" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Quarantine / Human Approval</text>

        <circle cx="440" cy="535" r="4" fill="#4f5d75"/>
        <text x="450" y="539" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Blocked / Fail-Closed</text>

        <text x="680" y="539" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">Invariant: $0 balance change without immutable audit</text>
      </svg>
    </div>
  </div>
</body>
</html>
