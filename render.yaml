services:
  - type: web
    name: aetherguard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/entrypoint.sh
    healthCheckPath: /api/health
    envVars:
      - key: AETHERGUARD_OPERATOR_TOKEN
        value: admin
      - key: GEMINI_API_KEY
        sync: false
